name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac --universal
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & backend
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }} -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installers
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          overwrite: true
          draft: false
          prerelease: false
          make_latest: true
          tag_name: ${{ github.ref_name }}
          name: Reclone Pro ${{ github.ref_name }}
          body: |
            ### Reclone Pro Release ${{ github.ref_name }}

            - Fixed cloud-to-local downloads and folder transfers across all operating systems.
            - Enabled native folder zipping/archiving directly within remote cloud storages (Google Drive, OneDrive, etc.).
            - Added in-app "Check for Updates" feature with instant notifications and download links.
            - Added persistent View Mode (Grid/List) and UI Theme settings across app restarts.
            - Automated Windows Rclone setup and macOS Gatekeeper bypass guidance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

