name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac --universal
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & backend
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }} -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installers
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          overwrite: true
          draft: false
          prerelease: false
          make_latest: true
          tag_name: ${{ github.ref_name }}
          name: Reclone Pro ${{ github.ref_name }}
          body: |
            ### Reclone Pro Release ${{ github.ref_name }}

            - **Desktop Notifications for Tasks**: Native OS desktop notifications on task completion (file transfers, cloud-to-local downloads, folder zipping, duplicate scans, and batch renames).
            - **Multi-Account Management & Union Remotes (GUI)**: Dedicated interface for linking multiple cloud accounts (e.g., multiple Google Drives) and an intuitive wizard to combine them into unified virtual volumes using Rclone's `union` backend with customizable storage policies (`mfs`, `lus`, `ff`, `all`).
            - **Artifact Naming Fix**: Clean hyphen-separated artifact filenames without spaces for reliable releases and automatic updates.
            - **Cloud Zipping & Path Handling**: Robust remote-to-local path handling and remote folder zipping across all operating systems.
            - **Automated Windows Setup**: Seamless automatic download and extraction of `rclone.exe` on Windows systems.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

